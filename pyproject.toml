[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gupy-tracker"
version = "0.2.0"
description = "Registro e ranking de candidaturas na Gupy, com Match Score."
requires-python = ">=3.10"
dependencies = []  # o núcleo e a CLI não têm dependências

[project.optional-dependencies]
grpc = ["grpcio>=1.60", "protobuf>=4.25"]

[tool.setuptools.packages.find]
include = ["gupy_tracker*"]
