<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <title>Gupy Tracker</title>
    <style>
      body { font: 14px system-ui, sans-serif; width: 300px; padding: 12px; }
      button { width: 100%; padding: 8px; margin-top: 8px; }
      .ajuda { color: #555; font-size: 12px; }
      #resultado { margin-top: 10px; white-space: pre-line; }
    </style>
  </head>
  <body>
    <p><strong>Ler minhas candidaturas</strong></p>
    <p class="ajuda">Abra <em>Minhas candidaturas</em> na Gupy e clique abaixo. A leitura só acontece com seu clique. Nada sai do seu computador, exceto o envio para o tracker local.</p>
    <button id="ler">Ler e enviar para o tracker</button>
    <div id="resultado" role="status"></div>
    <script type="module" src="popup.js"></script>
  </body>
</html>
